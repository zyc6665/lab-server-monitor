{% extends "base.html" %}
{% block title %}终端 - 服务器监控{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ asset_url('vendor/xterm/xterm.css') }}">
<link rel="stylesheet" href="{{ asset_url('terminal.css') }}">
{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>SSH 终端</h1>
    <p class="page-subtitle">仅在本机桌面客户端中可用，所有会话会记录元数据审计。</p>
  </div>
</div>

<div class="terminal-shell">
  <div class="terminal-toolbar">
    <label class="field-inline">
      <span>主机</span>
      <select id="terminal-host">
        {% for host in hosts %}
        <option value="{{ host.name }}">{{ host.name }} · {{ host.host }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="button" class="btn btn-primary" id="terminal-new">打开终端</button>
    <span id="terminal-status" class="terminal-status" role="status"></span>
  </div>
  <div class="terminal-tabs" id="terminal-tabs" role="tablist"></div>
  <div class="terminal-panes" id="terminal-panes">
    <div class="terminal-empty" id="terminal-empty">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
      <p>选择主机并点击“打开终端”</p>
    </div>
  </div>
</div>

<script>
  window.__TERMINAL_HOSTS__ = {{ hosts|tojson }};
  window.__TERMINAL_DESKTOP__ = {{ desktop_mode|tojson }};
</script>
{% endblock %}
{% block scripts %}
<script src="{{ asset_url('vendor/xterm/xterm.js') }}"></script>
<script src="{{ asset_url('vendor/xterm/addon-fit.js') }}"></script>
<script src="{{ asset_url('terminal.js') }}"></script>
{% endblock %}
