{% extends "base.html" %}
{% block title %}页面已过期 - 服务器监控{% endblock %}

{% block content %}
<section class="login-card">
  <h1 class="login-title">页面已过期</h1>
  <p class="error" role="alert">{{ message }}</p>
  <p class="muted">这通常发生在后台重启、切换端口或升级之后，刷新即可恢复，不会丢失已保存的数据。</p>
  <p><a class="primary-button" href="{{ request.path }}">刷新页面</a></p>
</section>
{% endblock %}
