appId: com.lab.servermonitor
productName: 服务器轮询监测工具
directories:
  output: release-electron
afterPack: scripts/after-pack.js
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../backend/dist/main.cjs
    to: backend/main.cjs
  - from: ../backend/assets
    to: backend/assets
    filter:
      - "**/*"
  - from: .vendor-stage/pkgs
    to: backend/node_modules
    filter:
      - "**/*"
  - from: build/icon.ico
    to: icon.ico
win:
  target: nsis
  icon: build/icon.ico
publish:
  provider: github
  owner: zyc6665
  repo: lab-server-monitor
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 服务器轮询监测工具
artifactName: "ServerMonitor-${version}-Setup.${ext}"
