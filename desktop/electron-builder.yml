appId: com.lab.servermonitor
productName: 服务器轮询监测工具
directories:
  output: release-electron
afterPack: scripts/after-pack.js
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../backend/dist/main.cjs
    to: backend/main.cjs
win:
  target: nsis
  icon: build/icon.ico
publish:
  provider: github
  owner: zyc6665
  repo: lab-server-monitor
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 服务器轮询监测工具
artifactName: "ServerMonitor-${version}-Setup.${ext}"
