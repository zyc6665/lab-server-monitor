appId: com.lab.servermonitor
productName: 服务器轮询监测工具
directories:
  output: release-electron
afterPack: scripts/after-pack.js
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../backend/dist/main.cjs
    to: backend/main.cjs
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
artifactName: "ServerMonitor-${version}-Setup.${ext}"
