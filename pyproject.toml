[project]
name = "servermanage"
version = "0.4.0"
description = "Centralized Linux server daily monitor with HTML email reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1.4,<4",
  "paramiko>=3.5.0,<4",
  "PyYAML>=6.0.2,<7",
  "python-dotenv>=1.0.1,<2",
  "Flask>=3.0.3,<4",
  "waitress>=3.0.0,<4",
  "winotify>=1.1.0,<2",
  "tzdata>=2024.1",
  "pystray>=0.19.5,<1",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
]
build = [
  "pyinstaller>=6.6,<7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["servermanage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=prepend"]
