name: ci

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-node:
    name: Node backend (vitest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.14.0 --activate
        shell: pwsh

      - name: Version consistency
        run: |
          node scripts/bump-version.mjs --check
          node --test scripts/bump-version.test.mjs
        shell: pwsh

      - name: Install (workspace)
        run: pnpm install --frozen-lockfile
        shell: pwsh

      - name: Typecheck
        run: pnpm --filter servermonitor-backend typecheck
        shell: pwsh

      - name: Test
        run: pnpm --filter servermonitor-backend test:coverage
        shell: pwsh

      - name: Build bundle
        run: pnpm --filter servermonitor-backend build
        shell: pwsh

  desktop:
    name: Electron desktop (node:test + vitest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.14.0 --activate
        shell: pwsh

      - name: Install
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
        shell: pwsh

      - name: Run tests
        run: pnpm test
        shell: pwsh

      - name: Typecheck (ts)
        run: pnpm typecheck
        shell: pwsh

      - name: Unit tests (vitest)
        run: pnpm test:unit
        shell: pwsh

      - name: Build main bundle
        run: pnpm build:main
        shell: pwsh

      - name: pnpm audit (non-blocking)
        continue-on-error: true
        run: pnpm audit --audit-level high
        shell: pwsh
