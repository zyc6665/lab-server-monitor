name: ci

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python backend (pytest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
        shell: pwsh

      - name: Version consistency
        run: python tools/bump_version.py --check
        shell: pwsh

      - name: Run tests
        run: python -m pytest -q
        shell: pwsh

  desktop:
    name: Electron desktop (node:test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.14.0 --activate
        shell: pwsh

      - name: Install
        run: pnpm install --frozen-lockfile
        shell: pwsh

      - name: Run tests
        run: pnpm test
        shell: pwsh

  release-gate:
    name: Release requires CI
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    needs: [backend, desktop]
    steps:
      - name: Gate passed
        run: echo "CI green; release-windows may proceed"
