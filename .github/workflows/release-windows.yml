name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.5.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Gate: a v* tag (or manual dispatch) must pass the same tests as CI before
  # anything is built or published. build-and-release `needs:` this job, so a
  # red test run can never produce a release asset.
  test:
    name: Release gate (tests must pass)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.14.0 --activate
        shell: pwsh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
        shell: pwsh

      - name: Version consistency
        run: python tools/bump_version.py --check
        shell: pwsh

      - name: Run backend tests
        run: python -m pytest -q
        shell: pwsh

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
        shell: pwsh

      - name: Run desktop tests
        working-directory: desktop
        run: pnpm test
        shell: pwsh

  build-and-release:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        # Only needed for tools/bump_version.py (stdlib-only); the runtime
        # backend is the Node bundle built below.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.14.0 --activate
        shell: pwsh

      - name: Resolve version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          if ([string]::IsNullOrWhiteSpace($version)) { throw "version is required" }
          python tools/bump_version.py $version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        shell: pwsh

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
        shell: pwsh

      - name: Build backend bundle
        # Bundles backend/src/server.ts -> backend/dist/main.cjs; the
        # electron-builder extraResources step copies it to resources/backend/main.cjs.
        run: pnpm --filter servermonitor-backend build
        shell: pwsh

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
        shell: pwsh

      - name: Build main bundle
        working-directory: desktop
        run: pnpm build:main
        shell: pwsh

      - name: Package NSIS installer (electron-builder)
        # --publish never: electron-builder still emits latest.yml (from the
        # `publish` block in electron-builder.yml) and the .blockmap, but the
        # explicit upload step below is the single source of truth for what
        # lands on the Release (avoids double-publishing on a tag push).
        working-directory: desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: pnpm exec electron-builder --win --publish never
        shell: pwsh

      - name: Verify release artifacts
        run: |
          $setup = Get-ChildItem -LiteralPath desktop/release-electron -Filter "ServerMonitor-*-Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup.exe not found in desktop/release-electron" }
          $latest = Join-Path 'desktop/release-electron' 'latest.yml'
          if (-not (Test-Path $latest)) { throw "latest.yml not found in desktop/release-electron" }
          $blockmap = Get-ChildItem -LiteralPath desktop/release-electron -Filter "*.blockmap" | Select-Object -First 1
          if (-not $blockmap) { throw "*.blockmap not found in desktop/release-electron" }
          Write-Host ("Setup:     {0} ({1:N2} MB)" -f $setup.FullName, ($setup.Length / 1MB))
          Write-Host "latest.yml: $latest"
          Write-Host "blockmap:   $($blockmap.FullName)"
        shell: pwsh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            desktop/release-electron/ServerMonitor-*-Setup.exe
            desktop/release-electron/latest.yml
            desktop/release-electron/*.blockmap
