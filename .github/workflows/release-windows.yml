name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.2.0 or 0.2.1-rc.1 (pre-release suffix => GitHub prerelease)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Gate: the same Node gates as CI must pass before anything is built or
  # published. build-and-release `needs:` this job.
  test:
    name: Release gate (Node tests must pass)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.14.0 --activate
        shell: pwsh

      - name: Version consistency
        run: |
          node scripts/bump-version.mjs --check
          node --test scripts/bump-version.test.mjs
        shell: pwsh

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
        shell: pwsh

      - name: Backend typecheck + tests
        run: |
          pnpm --filter servermonitor-backend typecheck
          pnpm --filter servermonitor-backend test
        shell: pwsh

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
        shell: pwsh

      - name: Desktop tests
        working-directory: desktop
        run: |
          pnpm test
          pnpm typecheck
          pnpm test:unit
        shell: pwsh

  build-and-release:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.14.0 --activate
        shell: pwsh

      - name: Resolve version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          if ([string]::IsNullOrWhiteSpace($version)) { throw "version is required" }
          node scripts/bump-version.mjs $version
          if ($LASTEXITCODE -ne 0) { throw "bump-version failed" }
          $prerelease = if ($version -match '-') { 'true' } else { 'false' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        shell: pwsh

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
        shell: pwsh

      - name: Build backend bundle
        # backend/src/server.ts -> backend/dist/main.cjs; electron-builder
        # extraResources copies it to resources/backend/main.cjs.
        run: pnpm --filter servermonitor-backend build
        shell: pwsh

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
        shell: pwsh

      - name: Build main bundle
        working-directory: desktop
        run: pnpm build:main
        shell: pwsh

      - name: Package NSIS installer (electron-builder)
        # --publish never: electron-builder still emits latest.yml and the
        # .blockmap; the explicit upload step below is the single source of
        # truth for Release assets.
        working-directory: desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: pnpm exec electron-builder --win --publish never
        shell: pwsh

      - name: Verify release artifacts (presence + sha512)
        run: |
          $dir = 'desktop/release-electron'
          $setup = Get-ChildItem -LiteralPath $dir -Filter "ServerMonitor-*-Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup.exe not found in $dir" }
          $latest = Join-Path $dir 'latest.yml'
          if (-not (Test-Path $latest)) { throw "latest.yml not found in $dir" }
          $blockmap = Join-Path $dir ($setup.Name + '.blockmap')
          if (-not (Test-Path $blockmap)) { throw "$($setup.Name).blockmap not found in $dir" }

          $yml = Get-Content -LiteralPath $latest -Raw
          $m = [regex]::Match($yml, '(?m)^sha512:\s*(\S+)\s*$')
          if (-not $m.Success) { throw "top-level sha512 missing in latest.yml" }
          $expected = $m.Groups[1].Value
          $sha = [System.Security.Cryptography.SHA512]::Create()
          $stream = [System.IO.File]::OpenRead($setup.FullName)
          try { $actual = [Convert]::ToBase64String($sha.ComputeHash($stream)) } finally { $stream.Dispose() }
          if ($actual -ne $expected) { throw "sha512 mismatch: latest.yml=$expected actual=$actual" }
          $pathMatch = [regex]::Match($yml, '(?m)^path:\s*(\S+)\s*$')
          if ($pathMatch.Success -and $pathMatch.Groups[1].Value -ne $setup.Name) {
            throw "latest.yml path '$($pathMatch.Groups[1].Value)' != $($setup.Name)"
          }
          Write-Host ("Setup:      {0} ({1:N2} MB)" -f $setup.FullName, ($setup.Length / 1MB))
          Write-Host "latest.yml: $latest (sha512 OK)"
          Write-Host "blockmap:   $blockmap"
        shell: pwsh

      - name: Write release notes
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $notes = @"
          ## ServerMonitor v$v（Windows 安装版）

          下载 **ServerMonitor-$v-Setup.exe** 运行安装向导即可；之后的新版本由程序内自动更新（electron-updater）获取。

          ### 旧绿色包（zip 解压版，v0.1.x）用户请注意
          - 旧绿色包内置的更新器**无法**升级到安装版，请**手动下载一次** ServerMonitor-$v-Setup.exe 并安装；
          - 安装后首次启动会自动导入旧目录中的 ``data\servermonitor.db``（主机、历史、凭据保留；凭据仍需同一 Windows 账户）；
          - 确认数据无误后，可退出旧程序并删除旧绿色包文件夹（建议先备份 ``config\``、``data\``、``logs\``）。

          更新详情见仓库 CHANGELOG.md。
          "@
          $notes -replace '(?m)^          ', '' | Out-File -FilePath release-notes.md -Encoding utf8
        shell: pwsh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            desktop/release-electron/ServerMonitor-*-Setup.exe
            desktop/release-electron/ServerMonitor-*-Setup.exe.blockmap
            desktop/release-electron/latest.yml
